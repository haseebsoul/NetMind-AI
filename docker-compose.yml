services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_DB: netmind_ai
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "8080:80"
    depends_on:
      - backend
