services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8001
      MONGODB_DB: netmind_ai
      CORS_ORIGINS: http://localhost:5174,http://localhost:8081
    ports:
      - "8001:8001"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001/api
    ports:
      - "8081:80"
    depends_on:
      - backend
