services:
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in your .env file}
      MONGODB_DB: netmind_ai
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "8080:80"
    depends_on:
      - backend
